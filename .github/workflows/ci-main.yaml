name: Employee Management System Frontend
description: This is the frontend application for the Employee Management System, built using React.

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    id-token: write
    contents: read
    security-events: write
    actions: read
    packages: read

env:
    AWS_REGION: ap-south-1
    NODE_VERSION: 24
    IMAGE_NAME: ${{ vars.REGISTRY_URL }}/frontend-app
    IMAGE_TAG: ${{ github.sha }}


jobs:
    build-test-scan:
        name: Build, Test and Scan
        runs-on: ubuntu-latest
        steps:
            # - name: Debug OIDC token claims
            #   run: |
            #     curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            #       "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            #     | jq -r .value | cut -d. -f2 | base64 -d 2>/dev/null | jq .

            # - name: Configure AWS credentials via OIDC
            #   uses: aws-actions/configure-aws-credentials@v4
            #   with:
            #     role-to-assume: arn:aws:iam::748624204530:role/github-actions-role
            #     aws-region: ${{ env.AWS_REGION }}

            # - name: Fetch GitHub token from Secrets Manager
            #   id: getcred
            #   run: |
            #     SECRET_JSON=$(aws secretsmanager get-secret-value \
            #       --secret-id github/accountcredential \
            #       --query SecretString --output text)
            #     TOKEN=$(echo "$SECRET_JSON" | jq -r .token)
            #     echo "::add-mask::$TOKEN"
            #     echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

            - name: Checkout source code
              uses: actions/checkout@v4
              # with:
              #  token: ${{ steps.getcred.outputs.token }}

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                node-version: '${{ env.NODE_VERSION }}'
                cache: 'npm'
                cache-dependency-path: 'package-lock.json'

            - name: Install Dependencies
              run: npm ci

            - name: Audit Dependencies
              run: npm audit

            - name: Test Application
              run: npm test run

            - name: Lint Code
              run: npm run lint

            - name: Build Production Assets
              run: npm run build
            
            - name: Package Artifact
              run: tar -czf frontend-artifact.tar.gz -C dist .

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                name: frontend-artifacts-${{ github.run_id }}
                path: frontend-artifact.tar.gz
                if-no-files-found: error
                retention-days: 1

    analyze:
      name: CodeQL Analysis
      runs-on: ubuntu-latest
      needs: build-test-scan

      steps:
        - name: Checkout source code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Initialize CodeQL
          uses: github/codeql-action/init@v4
          with:
            languages: javascript-typescript
            dependency-caching: true

        - name: Analyze
          uses: github/codeql-action/analyze@v4
              
    Publish-Artifact:
        name: Build Scan and publish image to ECR
        runs-on: ubuntu-latest
        needs: [build-test-scan,analyze]
        if: needs.build-test-scan.result=='success' && needs.analyze.result=='success'
        steps:
            - name: Configure AWS credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::748624204530:role/github-actions-role
                aws-region: ${{ env.AWS_REGION }}

            - name: Verify AWS identity
              run: aws sts get-caller-identity

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Checkout source code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - run: ls -la

            - name: Build image locally for scanning
              uses: docker/build-push-action@v6
              with:
                context: .
                file: Dockerfile
                load: true
                push: false
                tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
                cache-from: type=gha
                cache-to: type=gha,mode=max

            - name: Block vulnerable image publication
              uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
              with:
                scan-type: image
                image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
                severity: HIGH,CRITICAL
                ignore-unfixed: true
                exit-code: "1"

            - name: Publish immutable commit image with SBOM and provenance
              id: publish
              uses: docker/build-push-action@v6
              with:
                registry: 
                aws_role_to_assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
                aws_default_region: ${{ env.AWS_REGION}}
                context: .
                file: Dockerfile
                push: true
                tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
                labels: |
                  org.opencontainers.image.revision=${{ github.sha }}
                  org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                  org.opencontainers.image.version=${{ github.sha }}
                provenance: mode=max
                sbom: true
                cache-from: type=gha